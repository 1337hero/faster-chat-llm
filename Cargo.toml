[package]
name = "faster-chat-llm"
version = "0.1.0"
edition = "2024"

[dependencies]
memmap2 = "0.9"
minijinja = { version = "3.1.0", features = ["json", "loop_controls", "serde"] }
minijinja-contrib = { version = "3.1.0", features = ["pycompat"] }
serde_json = "1.0.154"
unicode-general-category = "1.1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Iteration builds: the host side only orchestrates kernels, so it gives up LTO and
# single-unit codegen for a relink measured in a second or two.
[profile.fast]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
